<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học tiếng Anh — Mít &amp; Moon</title>
<meta name="theme-color" content="#F6F3EC">
<link rel="manifest" href="manifest-home.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mít & Moon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --card:#FFF; --ink:#1C2B26; --soft:#6B7A74; --line:#E4E0D5;
  --mit:#2E8B72; --mit2:#D9930F;
  --moon:#7C5CE0; --moon2:#3AC8F5;
  --sh:0 2px 0 rgba(28,43,38,.05), 0 14px 30px -20px rgba(28,43,38,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);
  background-image:radial-gradient(120% 60% at 50% 0%,#FFF6E4 0%,#F6F3EC 55%);
  color:var(--ink);font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
}
h1,h2,h3,b{font-family:"Baloo 2","Be Vietnam Pro",sans-serif;font-weight:800;line-height:1.15;margin:0}
a{text-decoration:none;color:inherit}
:focus-visible{outline:3px solid var(--mit2);outline-offset:3px;border-radius:14px}

.wrap{max-width:620px;margin:0 auto;padding:0 15px calc(30px + env(safe-area-inset-bottom))}

.top{display:flex;align-items:center;gap:11px;padding:calc(20px + env(safe-area-inset-top)) 0 18px}
.logo{width:46px;height:46px;flex:none;border-radius:16px;background:linear-gradient(150deg,var(--mit2),var(--mit));
  display:grid;place-items:center;font-size:24px;transform:rotate(-7deg);box-shadow:0 8px 18px -8px var(--mit)}
.top h1{font-size:21px}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}

.sect{margin-bottom:26px}
.shead{display:flex;align-items:center;gap:9px;margin:0 3px 11px}
.savatar{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px}
.shead h2{font-size:18px}
.shead span{font-size:11.5px;color:var(--soft);font-weight:500;margin-left:auto;text-align:right;line-height:1.3}

/* --- thẻ lớn cho Mít --- */
.big{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:20px;padding:15px 16px;
  box-shadow:var(--sh);border:1.5px solid var(--line);transition:transform .13s}
.big:active{transform:scale(.975)}
.big .em{width:52px;height:52px;flex:none;border-radius:17px;background:#E9F5F0;display:grid;place-items:center;font-size:26px}
.big b{display:block;font-size:17px}
.big small{display:block;font-size:12.5px;color:var(--soft);line-height:1.4;margin-top:2px}
.big .go{margin-left:auto;flex:none;font-size:22px;color:var(--soft)}

/* --- lưới chủ đề của Moon --- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.topic{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:14px;
  box-shadow:var(--sh);border:1.5px solid var(--line);display:flex;flex-direction:column;min-height:132px;transition:transform .13s}
.topic:active{transform:scale(.965)}
.topic:after{content:"";position:absolute;right:-26px;top:-30px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,224,.16),transparent 70%)}
.topic .em{font-size:30px;line-height:1;margin-bottom:9px}
.topic b{font-size:15.5px;line-height:1.2}
.topic small{display:block;font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.35}
.topic .n{margin-top:auto;padding-top:9px;font-size:11px;font-weight:700;color:var(--moon)}

.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:20px;padding:22px 16px;text-align:center;
  color:var(--soft);font-size:13px;line-height:1.6}

.foot{text-align:center;font-size:11.5px;color:var(--soft);padding-top:6px;line-height:1.6}
@media(min-width:520px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">📚</div>
    <div>
      <h1>Học tiếng Anh</h1>
      <p>Mít &amp; Moon — mỗi bé một phần riêng</p>
    </div>
  </div>

  <!-- ===== Mít ===== -->
  <section class="sect">
    <div class="shead">
      <span class="savatar" style="background:#E9F5F0">🧸</span>
      <h2 style="color:var(--mit)">Mít</h2>
      <span>Mẹ nói tiếng Anh với con<br>2 tuổi</span>
    </div>
    <a class="big" href="mit/">
      <span class="em">🌅</span>
      <span>
        <b>Một ngày của bé</b>
        <small>34 chủ đề · 426 câu — dậy, ăn sáng, đi lớp, tắm, đi ngủ. Có hình, phiên âm và nút nghe.</small>
      </span>
      <span class="go">›</span>
    </a>
  </section>

  <!-- ===== Moon ===== -->
  <section class="sect">
    <div class="shead">
      <span class="savatar" style="background:#EFEAFD">🌙</span>
      <h2 style="color:var(--moon)">Moon</h2>
      <span>Game ôn từ vựng<br>lớp 4</span>
    </div>
    <div class="grid" id="moonGrid"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
/* ==========================================================
   Danh sách chủ đề của Moon.
   Thêm chủ đề mới = thêm đúng một dòng vào mảng này.
   ========================================================== */
const MOON = [
  { file:"moon/universe.html", em:"🌌", en:"Space & Universe", vi:"Không gian & Vũ trụ", n:19 },
  { file:"moon/camping.html",  em:"🏕️", en:"Camping & Nature",  vi:"Cắm trại & thiên nhiên", n:16 },
  { file:"moon/ancient.html",  em:"🏺", en:"Ancient History",  vi:"Lịch sử cổ đại & Khảo cổ", n:14 },
  { file:"moon/travel.html",   em:"🎈", en:"Trips & Places",   vi:"Chuyến đi & nơi đến", n:13 },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("moonGrid").innerHTML = MOON.length
  ? MOON.map(t => `<a class="topic" href="${esc(t.file)}">
      <span class="em">${t.em}</span>
      <b>${esc(t.en)}</b>
      <small>${esc(t.vi)}</small>
      <span class="n">${t.n} từ mới</span>
    </a>`).join("")
  : `<div class="empty">Chưa có chủ đề nào.<br>Thêm từ mới để tạo game đầu tiên cho Moon.</div>`;

const tong = MOON.reduce((a, t) => a + t.n, 0);
document.getElementById("foot").textContent =
  MOON.length ? `Moon đang có ${MOON.length} chủ đề · ${tong} từ mới` : "";

if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
